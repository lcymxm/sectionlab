name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 几何内核测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 对着解析解跑 36 条断言
        run: node test/geometry.test.js

  build:
    name: 交叉编译
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, out: SectionLab.exe }
          - { goos: linux, goarch: amd64, out: sectionlab-linux-amd64 }
          - { goos: darwin, goarch: arm64, out: sectionlab-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - name: 构建 ${{ matrix.goos }}/${{ matrix.goarch }}
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X sectionlab/web.Version=$VERSION" \
            -o "dist/${{ matrix.out }}" ./cmd/sectionlab
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.out }}

  release:
    name: 发布
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 校验产物
        run: |
          ls -lR dist
          test -f dist/SectionLab.exe
          test -f dist/sectionlab-linux-amd64
          test -f dist/sectionlab-macos-arm64
      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "SectionLab ${GITHUB_REF_NAME}" \
            --generate-notes
